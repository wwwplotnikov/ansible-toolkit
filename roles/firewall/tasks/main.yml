---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set the default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set the default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow inbound TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Rate limit inbound SSH
  community.general.ufw:
    rule: limit
    port: "{{ firewall_ssh_port }}"
    proto: tcp
  when: firewall_rate_limit_ssh

- name: Configure ufw logging
  community.general.ufw:
    logging: "{{ firewall_logging }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Deploy the DOCKER-USER ruleset
  ansible.builtin.template:
    src: after.rules.j2
    dest: /etc/ufw/after.rules
    owner: root
    group: root
    mode: "0640"
  when: firewall_restrict_docker
  notify: Reload ufw

- name: Deploy the DOCKER-USER ruleset for IPv6
  ansible.builtin.template:
    src: after6.rules.j2
    dest: /etc/ufw/after6.rules
    owner: root
    group: root
    mode: "0640"
  when: firewall_restrict_docker
  notify: Reload ufw
